# Lines to add to the HTTPS <VirtualHost> that proxies Overleaf, ABOVE its catch-all `ProxyPass /` (the first
# matching ProxyPass wins). flushpackets keeps the MCP event stream unbuffered; the timeout covers long
# compiles. With `ProxyPreserveHost On` the Host header is the public name, so list it in MCP_ALLOWED_HOSTS.
# Check with `apachectl configtest`, then reload Apache gracefully (`systemctl reload apache2`).
ProxyPass        /mcp http://127.0.0.1:5010/mcp flushpackets=on timeout=900
ProxyPassReverse /mcp http://127.0.0.1:5010/mcp
